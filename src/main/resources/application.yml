spring:
  application:
    name: lender-assistant
  datasource:
    # dev 默认值指向本地 Docker 容器（lender-pg），生产用环境变量覆盖
    # 红线提示：开源前检查这里没有真实凭据，密码通过 PG_PASSWORD 环境变量注入
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:lender_assistant}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:lender123}
  ai:
    retry:
      max-attempts: 1        # 关闭 Spring AI 内置重试：重试只由 rag.resilience.max-attempts 单层负责
    openai:
      # OpenAI 兼容网关：换模型只改这三个环境变量，代码不用动。
      # 切换 DeepSeek 官方：LLM_BASE_URL=https://api.deepseek.com  LLM_MODEL=deepseek-chat
      # 切换其他兼容厂商：填对应 base-url（需包含到 /v1 这一级）与模型名即可
      # base-url 末尾不要带 /chat/completions，starter 会自行拼接请求路径
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      # key 只从环境变量读取，不写进代码库（红线：仓库将来开源）；占位值保证无 key 也能启动
      api-key: ${LLM_API_KEY:sk-fake-openai-compatible-key}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}
          temperature: 0.7
  servlet:
    multipart:
      # 资方接口文档（PDF/Word/Excel）单文件上限 50MB，整包（含表单）留 10MB 余量
      max-file-size: 50MB
      max-request-size: 60MB

mybatis:
  # Mapper XML 统一放 resources/mapper（§6.2），与接口不在同一 classpath 位置，必须显式指定
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 下划线列名 → 驼峰属性（resultMap 的 <arg column> 仍显式写出，不依赖隐式映射）
    map-underscore-to-camel-case: true

# 应用自定义配置（RAG 链路参数集中在这里，阶段 3 调优只动这里）
rag:
  chat:
    # provider: openai=真实模型(OpenAI 兼容协议，默认) / mock=本地Mock(无key时联调)
    provider: ${RAG_CHAT_PROVIDER:openai}
  embedding:
    # provider: hash=本地Mock(开发联调) / zhipu=智谱API(有key后切换)
    provider: ${RAG_EMBEDDING_PROVIDER:hash}
    dimension: 1024
    # TODO 待录入真实智谱 API key（provider=zhipu 时生效）；当前为假值占位
    api-key: ${ZHIPU_API_KEY:fake-zhipu-api-key}
  extract:
    # provider: mock=规则抽取(无key联调) / openai=JSON Schema抽取(有key后切换)
    provider: ${RAG_EXTRACT_PROVIDER:mock}
  draft:
    # provider: mock=模板渲染(无key联调) / openai=模型生成(有key后切换)
    provider: ${RAG_DRAFT_PROVIDER:mock}
  qa:
    # 追问回放给模型的历史上限：最近 6 个完整轮次、总字符 2000（超限从最旧一轮整轮丢弃）
    history-max-rounds: ${RAG_QA_HISTORY_MAX_ROUNDS:6}
    history-max-chars: ${RAG_QA_HISTORY_MAX_CHARS:2000}
  routing:
    # 路由置信度阈值：低于该值一律降级 KNOWLEDGE（fail-open）
    confidence-threshold: ${RAG_ROUTING_CONFIDENCE_THRESHOLD:0.6}
    # 无关问题的固定提示（非模型生成，done.provider=rule）
    irrelevant-reply: ${RAG_ROUTING_IRRELEVANT_REPLY:我只回答资方接入相关的资料问题，可以换个问法再试试。}
  plan:
    # 整轮预算（路由+计划+步骤+合成共用）；唯一超时配置，其余超时为代码常量
    total-budget-ms: ${RAG_PLAN_TOTAL_BUDGET_MS:90000}
    # 计划步数区间：越界整单弃用，退回 KNOWLEDGE 单次检索
    min-steps: ${RAG_PLAN_MIN_STEPS:2}
    max-steps: ${RAG_PLAN_MAX_STEPS:5}
    tools:
      # mock 业务工具开关：生产必须关闭，只有联调需要 customer.profile / lender.product 时打开
      mock-enabled: ${RAG_PLAN_TOOLS_MOCK_ENABLED:false}
  search:
    # 向量通道余弦距离阈值：> 该值的召回丢弃；-1 表示关闭（默认）。是否开启由阶段3评估数据决定
    max-distance: -1
  resilience:
    # chaos=true 时模型调用确定性失败（测试/降级演练用，平时保持 false）
    chaos: ${RAG_RESILIENCE_CHAOS:false}
    failure-threshold: 3   # 连续 3 次执行失败 → 熔断 OPEN
    wait-duration-sec: 30  # 熔断 OPEN 保持 30s 后进入 HALF_OPEN 试探
    max-attempts: 2        # 非流式调用（抽取）的重试次数；SSE 问答固定不重试
  split:
    # strategy: fixed=固定字数 / section=按标题段落
    strategy: ${RAG_SPLIT_STRATEGY:section}
    chunk-size: 500      # fixed 策略: 每块目标字符数
    overlap: 100         # fixed 策略: 相邻块重叠字符数（防止语义被切断）

server:
  port: 8080

logging:
  file:
    # 日志落盘目录：本地为工作目录下 logs/，容器内为 /app/logs（compose 挂回宿主 ./logs）。
    # 不拆 application-{local,prod}.yml：本地与生产的差异已由环境变量表达，此处路径天然同构
    path: ${LOG_PATH:./logs}
  level:
    org.springframework.ai: INFO
