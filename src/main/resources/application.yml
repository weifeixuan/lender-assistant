spring:
  application:
    name: lender-assistant
  ai:
    deepseek:
      # 从环境变量读取，不把 key 写进代码库（红线：仓库将来开源）
      # 未配置时用占位符保证应用能启动（/health 可用），chat 调用会 401
      api-key: ${DEEPSEEK_API_KEY:no-key-set}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

server:
  port: 8080

logging:
  level:
    org.springframework.ai: INFO
